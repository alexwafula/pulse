name: Build Azure Images

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: azure-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'alexwafula/pulse' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    if: github.repository == 'alexwafula/pulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.PULSE_ACR_NAME }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          echo "REGISTRY=$ACR_NAME.azurecr.io" >> "$GITHUB_ENV"

      - name: Build Go and Python images
        shell: bash
        run: |
          set -euo pipefail
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build --build-arg PULSE_BUILD_SHA="$GITHUB_SHA" --build-arg PULSE_BUILD_TIME="$built_at" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/alexwafula/pulse" -t "$REGISTRY/pulse-web:$GITHUB_SHA" -f Dockerfile .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/alexwafula/pulse" -t "$REGISTRY/pulse-agents:$GITHUB_SHA" -f agents/Dockerfile .

      - name: Install browser test dependencies
        run: npm ci

      - name: Test both containers without model calls
        shell: bash
        run: |
          set -euo pipefail
          service_token=$(openssl rand -hex 32)
          echo "::add-mask::$service_token"
          docker network create pulse-smoke
          docker run -d --name pulse-agents --network pulse-smoke -p 8090:8090 -e PULSE_REQUIRE_AUTH=1 -e PULSE_AGENT_AUTH_TOKEN="$service_token" -e PULSE_AGENT_MODE=recorded -e PULSE_MODEL_REQUEST_CAP=0 "$REGISTRY/pulse-agents:$GITHUB_SHA"
          docker run -d --name pulse-web --network pulse-smoke -p 8080:8080 -e PULSE_AGENT_AUTH_TOKEN="$service_token" -e PULSE_AGENTS_URL=http://pulse-agents:8090 "$REGISTRY/pulse-web:$GITHUB_SHA"
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8090/healthz && break; sleep 1; done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8090/insights)" = 401
          PULSE_URL=http://127.0.0.1:8080 node tests/integration/container-smoke.mjs
          PULSE_URL=http://127.0.0.1:8080 CHROME_PATH=/usr/bin/google-chrome node tests/integration/homepage-browser.mjs

      - name: Azure login with federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PULSE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PULSE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PULSE_AZURE_SUBSCRIPTION_ID }}

      - name: Push tested images to Azure
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker push "$REGISTRY/pulse-web:$GITHUB_SHA"
          docker push "$REGISTRY/pulse-agents:$GITHUB_SHA"
          printf 'Built and smoke-tested source `%s`.\n\nImages:\n- `%s/pulse-web:%s`\n- `%s/pulse-agents:%s`\n' "$GITHUB_SHA" "$REGISTRY" "$GITHUB_SHA" "$REGISTRY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Container diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          docker logs pulse-web 2>&1 || true
          docker logs pulse-agents 2>&1 || true
          docker rm -f pulse-web pulse-agents || true
          docker network rm pulse-smoke || true

  deploy:
    needs: build
    if: github.repository == 'alexwafula/pulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.PULSE_ACR_NAME }}.azurecr.io
      RESOURCE_GROUP: pulse-hackathon
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Skip superseded release
        id: current
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo 'release=true' >> "$GITHUB_OUTPUT"; else echo 'release=false' >> "$GITHUB_OUTPUT"; fi

      - name: Azure login with app-scoped deployment identity
        if: steps.current.outputs.release == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PULSE_AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.PULSE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PULSE_AZURE_SUBSCRIPTION_ID }}

      - name: Update only the two runtime images
        if: steps.current.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$RESOURCE_GROUP" --name pulse-agents --image "$REGISTRY/pulse-agents:$GITHUB_SHA" --output none
          az containerapp update --resource-group "$RESOURCE_GROUP" --name pulse-web --image "$REGISTRY/pulse-web:$GITHUB_SHA" --output none
          host=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name pulse-web --query properties.configuration.ingress.fqdn --output tsv)
          echo "PULSE_URL=https://$host" >> "$GITHUB_ENV"
          agent_host=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name pulse-agents --query properties.configuration.ingress.fqdn --output tsv)
          echo "PULSE_AGENT_URL=https://$agent_host" >> "$GITHUB_ENV"

      - name: Verify deployed homepage, replay and authenticated insights
        if: steps.current.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tests/integration/container-smoke.mjs
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 60 -H 'Content-Type: application/json' -d '{}' "$PULSE_AGENT_URL/insights")" = 401
          printf 'Deployed tested main source `%s`.\n\n[Open Pulse](%s/)\n' "$GITHUB_SHA" "$PULSE_URL" >> "$GITHUB_STEP_SUMMARY"
